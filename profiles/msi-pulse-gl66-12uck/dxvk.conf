# MSI Pulse GL66 12UCK. RTX 3050 Laptop, 4096 MiB device memory (131 MiB reserved
# on the Windows driver that measured it). DXVK 3.1.1, which this tree pins.
#
# dxgi.maxDeviceMemory / dxgi.maxSharedMemory change what the game is told, so
# streaming stays under the heap the desktop copy also uses. They are not an
# allocator cap. Leave dxvk.maxMemoryBudget unset: DXVK documents it as a debug
# limiter that degrades performance.

dxgi.maxDeviceMemory = 3072
dxgi.maxSharedMemory = 512
